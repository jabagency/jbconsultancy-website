name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Queue deploys rather than cancelling one that is already in flight.
# A deploy mid-flight must finish; only a pending (not yet started) run
# is superseded.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # configure-pages outputs the canonical base_url and base_path for this
      # repository. Using these values means the exact same source tree builds
      # correctly whether the repo is deployed as a user site
      # (user.github.io → base "/") or a project site
      # (user.github.io/repo → base "/repo/") with no file edits required.
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Run unit tests before building so that a broken config is never deployed.
      - name: Unit tests (Vitest)
        run: npm test

      - name: Build
        # SITE_URL and BASE_PATH are read by astro.config.mjs to set `site` and
        # `base`. Injecting them from configure-pages' outputs is what makes
        # canonical URLs, sitemap entries and asset paths correct for the actual
        # deployment target — no manual config edits needed.
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
